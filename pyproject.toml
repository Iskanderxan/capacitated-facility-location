[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctvopt"
version = "1.0.0"
description = "Capacitated facility location for CTV ad pod stitching servers: greedy baseline, k-nearest MIP, and a provable optimality certificate."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Davit Buliskeria" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.11",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
pulp = ["pulp>=2.7"]
dev = ["pytest>=7", "pulp>=2.7"]

[project.scripts]
ctvopt = "ctvopt.cli:main"

[tool.setuptools]
packages = ["ctvopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
